[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rainbo-scrape"
version = "0.2.0"
description = "Owned, API-key-free web extraction and durable crawl jobs for RAINBO"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.12,<4", "beautifulsoup4>=4.13,<5", "lxml>=5,<7", "markdownify>=1,<2", "pypdf>=6,<7", "playwright>=1.55,<2", "mcp>=1.20,<2", "jsonschema>=4.23,<5", "defusedxml>=0.7,<1", "certifi>=2024.1.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[project.scripts]
rainbo-scrape = "rainbo_scrape.cli:main"
apex-scraper-mcp = "rainbo_scrape.hosted_mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rainbo_scrape = ["ui/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
